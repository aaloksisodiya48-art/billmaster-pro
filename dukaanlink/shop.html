<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Shop online · DukaanLink</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font:15px system-ui,sans-serif}.top{background:#101827;color:#fff;padding:24px 18px}.wrap{max-width:850px;margin:auto;padding:18px}.brand{font-size:12px;color:#b7b3ff;font-weight:800;letter-spacing:1px}.top h1{margin:8px 0 4px;font-size:26px}.muted{color:#738096;font-size:13px}.top p{color:#c5cede;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{background:white;border:1px solid #e3e8f0;border-radius:15px;padding:14px}.emoji{font-size:28px;background:#f0f1ff;width:48px;height:48px;border-radius:13px;display:grid;place-items:center;margin-bottom:10px}.card b{font-size:14px}.price{font-weight:900;font-size:18px;margin:6px 0}.stock{font-size:11px;color:#718096}.btn{background:#635bff;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;width:100%;margin-top:10px}.btn:disabled{background:#aab1bf}.panel{background:#fff;border:1px solid #e3e8f0;border-radius:15px;padding:16px;margin-top:18px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:#68758a;font-weight:800}.field input,.field textarea{border:1px solid #dce2eb;border-radius:9px;padding:11px;font:inherit;width:100%}.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #edf0f5;font-size:13px}.total{font-size:21px;font-weight:900}.empty{background:#fff;padding:30px;border-radius:14px;text-align:center;color:#758197}.foot{text-align:center;color:#8490a3;font-size:11px;padding:25px}
</style></head><body><header class="top"><div class="wrap"><div class="brand">DUKAANLINK · ONLINE STORE</div><h1 id="shop">Welcome to our shop</h1><p id="address"></p></div></header><main class="wrap"><p class="muted">Browse our available products and send your order directly to the shop on WhatsApp.</p><div id="products" class="grid"></div><section class="panel"><h2 style="margin:0 0 6px;font-size:18px">Your order</h2><div id="cart"><p class="muted">Add products to get started.</p></div><div class="field"><label>YOUR NAME</label><input id="customer" placeholder="Full name"></div><div class="field"><label>DELIVERY ADDRESS / NOTE (OPTIONAL)</label><textarea id="note" rows="2" placeholder="Your address or special instructions"></textarea></div><button class="btn" id="send" onclick="sendOrder()" disabled>Send order on WhatsApp</button><p class="muted">No online payment is collected here. The shop will confirm your order on WhatsApp.</p></section><div class="foot">Powered by DukaanLink</div></main><script>
const params=new URLSearchParams(location.search);let data;try{let raw=params.get('data');if(raw)data=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){};const products=Array.isArray(data?.products)?data.products:[];const profile=data?.profile||{};let cart={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});document.getElementById('shop').textContent=profile.name||'Welcome to our shop';document.getElementById('address').textContent=profile.address||'';function render(){let el=document.getElementById('products');el.innerHTML=products.length?products.map((p,i)=>'<article class="card"><div class="emoji">🛍️</div><b>'+esc(p.name)+'</b><div class="price">'+money(p.price)+'</div><div class="stock">'+(p.qty>0?Math.max(0,p.qty)+' available':'Currently unavailable')+'</div><button class="btn" '+(p.qty<=0?'disabled':'')+' onclick="add('+i+')">Add to order</button></article>').join(''):'<div class="empty" style="grid-column:1/-1">This shop has not published any products yet. Ask the shop owner for an updated link.</div>';let chosen=products.map((p,i)=>({...p,count:cart[i]||0})).filter(p=>p.count>0),total=chosen.reduce((s,p)=>s+p.price*p.count,0);document.getElementById('cart').innerHTML=chosen.length?chosen.map(p=>'<div class="line"><span>'+esc(p.name)+' × '+p.count+'</span><b>'+money(p.price*p.count)+'</b></div>').join('')+'<div class="line"><b>Total</b><span class="total">'+money(total)+'</span></div>':'<p class="muted">Add products to get started.</p>';document.getElementById('send').disabled=!chosen.length}function add(i){let p=products[i];if((cart[i]||0)<p.qty){cart[i]=(cart[i]||0)+1;render()}}function sendOrder(){let name=document.getElementById('customer').value.trim();if(!name){alert('Please enter your name.');return}let lines=products.map((p,i)=>cart[i]?p.name+' × '+cart[i]+' = '+money(p.price*cart[i]):'').filter(Boolean);let total=products.reduce((s,p,i)=>s+p.price*(cart[i]||0),0);let msg='Hello '+(profile.name||'')+', I would like to place an order:%0A'+encodeURIComponent(lines.join('\n'))+'%0AOrder total: '+encodeURIComponent(money(total))+'%0ACustomer: '+encodeURIComponent(name)+'%0ANote: '+encodeURIComponent(document.getElementById('note').value);let phone=String(profile.phone||'').replace(/\D/g,'');if(!phone){alert('The shop owner has not added a WhatsApp number yet. Please contact the shop directly.');return}window.open('https://wa.me/'+phone+'?text='+msg,'_blank')}render();
</script></body></html>
